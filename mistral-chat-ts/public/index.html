<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Mistral Chat</title>
  <style>
    :root { color-scheme: light dark; }
    * { box-sizing: border-box; }
    body {
      margin: 0;
      font-family: system-ui, -apple-system, "Segoe UI", sans-serif;
      display: flex;
      justify-content: center;
      background: #f4f4f5;
      color: #18181b;
    }
    main {
      width: 100%;
      max-width: 720px;
      height: 100vh;
      display: flex;
      flex-direction: column;
      padding: 1rem;
      gap: 0.75rem;
    }
    h1 { font-size: 1.25rem; margin: 0.25rem 0; }
    #messages {
      flex: 1;
      overflow-y: auto;
      display: flex;
      flex-direction: column;
      gap: 0.5rem;
      padding: 0.5rem;
      background: #fff;
      border: 1px solid #e4e4e7;
      border-radius: 0.75rem;
    }
    .msg {
      max-width: 80%;
      padding: 0.6rem 0.8rem;
      border-radius: 0.75rem;
      white-space: pre-wrap;
      line-height: 1.4;
    }
    .user { align-self: flex-end; background: #ff6b00; color: #fff; }
    .assistant { align-self: flex-start; background: #e4e4e7; }
    .error { align-self: flex-start; background: #fee2e2; color: #b91c1c; }
    form { display: flex; gap: 0.5rem; }
    input {
      flex: 1;
      padding: 0.7rem 0.9rem;
      border: 1px solid #d4d4d8;
      border-radius: 0.75rem;
      font-size: 1rem;
    }
    button {
      padding: 0.7rem 1.1rem;
      border: none;
      border-radius: 0.75rem;
      background: #18181b;
      color: #fff;
      font-size: 1rem;
      cursor: pointer;
    }
    button:disabled { opacity: 0.5; cursor: default; }
    @media (prefers-color-scheme: dark) {
      body { background: #18181b; color: #fafafa; }
      #messages { background: #27272a; border-color: #3f3f46; }
      .assistant { background: #3f3f46; color: #fafafa; }
      input { background: #27272a; color: #fafafa; border-color: #3f3f46; }
      button { background: #ff6b00; }
    }
  </style>
</head>
<body>
  <main>
    <h1>Mistral Chat <small>(mistral-small-latest)</small></h1>
    <div id="messages"></div>
    <form id="form">
      <input id="input" type="text" placeholder="Type a message..." autocomplete="off" required />
      <button id="send" type="submit">Send</button>
    </form>
  </main>
  <script>
    const messages = document.getElementById('messages');
    const form = document.getElementById('form');
    const input = document.getElementById('input');
    const send = document.getElementById('send');

    function addMessage(role, text) {
      const div = document.createElement('div');
      div.className = role === 'user' ? 'msg user' : 'msg ' + role;
      div.textContent = text;
      messages.appendChild(div);
      messages.scrollTop = messages.scrollHeight;
      return div;
    }

    form.addEventListener('submit', async (event) => {
      event.preventDefault();
      const text = input.value.trim();
      if (!text) return;
      input.value = '';
      send.disabled = true;
      addMessage('user', text);
      const pending = addMessage('assistant', '...');
      try {
        const res = await fetch('/api/chat', {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({ message: text }),
        });
        const data = await res.json();
        if (!res.ok) throw new Error(data.error || 'Request failed');
        pending.textContent = data.reply;
      } catch (err) {
        pending.className = 'msg error';
        pending.textContent = err.message;
      } finally {
        send.disabled = false;
        input.focus();
      }
    });
  </script>
</body>
</html>
