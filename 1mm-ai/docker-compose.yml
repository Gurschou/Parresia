services:
  db:
    image: pgvector/pgvector:pg17
    container_name: onemm-ai-db
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: onemm_ai
    ports:
      - "5432:5432"
    volumes:
      - onemm_ai_pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d onemm_ai"]
      interval: 5s
      timeout: 5s
      retries: 10

volumes:
  onemm_ai_pgdata:
